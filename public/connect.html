<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Connect Instagram</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101114;
        color: #f5f5f6;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #303139;
        border-radius: 18px;
        background: #191a20;
        box-shadow: 0 24px 80px #0006;
      }
      .eyebrow {
        color: #c4a4ff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 { margin: 10px 0; font-size: 30px; }
      p { color: #b7b7c1; line-height: 1.55; }
      label { display: block; margin: 24px 0 8px; font-size: 14px; }
      input {
        width: 100%;
        border: 1px solid #454650;
        border-radius: 10px;
        padding: 13px 14px;
        background: #101114;
        color: inherit;
        font: inherit;
      }
      input:focus { outline: 2px solid #a477ff; outline-offset: 2px; }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 13px 16px;
        border: 0;
        border-radius: 10px;
        background: #a477ff;
        color: #17121f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: .7; }
      #status { min-height: 24px; margin: 14px 0 0; font-size: 14px; }
      .note { margin-top: 22px; font-size: 12px; }
      .error { color: #ff9a9a; }
      .success { color: #8fe1b1; }
      @media (max-width: 480px) { main { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Account setup</div>
      <h1>Connect Instagram</h1>
      <p>Paste your Railway admin API token here, then continue to Meta to authorize your Instagram professional account.</p>
      <label for="token">Railway admin API token</label>
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste token">
      <button id="connect" type="button">Continue to Meta</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">The token is sent only to this site to start login. It is not saved in browser storage. Never share it in chat; rotate it first if it has been exposed.</p>
    </main>
    <script>
      const tokenInput = document.querySelector("#token");
      const connectButton = document.querySelector("#connect");
      const status = document.querySelector("#status");

      connectButton.addEventListener("click", async () => {
        const token = tokenInput.value.trim();
        if (!token) {
          status.className = "error";
          status.textContent = "Paste your admin API token first.";
          tokenInput.focus();
          return;
        }

        connectButton.disabled = true;
        status.className = "";
        status.textContent = "Starting secure Meta login…";
        try {
          const response = await fetch("/api/oauth/meta/start", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            cache: "no-store",
          });
          const contentType = response.headers.get("content-type") || "";
          if (!contentType.includes("application/json")) {
            throw new Error(
              "The server returned a webpage instead of API JSON. The new connection page and server changes may not be deployed together yet.",
            );
          }
          const result = await response.json();
          if (!response.ok) {
            throw new Error(
              response.status === 401
                ? "Token rejected. Check Railway's deployed ADMIN_API_TOKEN and try again."
                : result.error || "Could not start Meta login.",
            );
          }
          if (typeof result.authorizationUrl !== "string") {
            throw new Error("The server did not return a Meta login URL.");
          }
          tokenInput.value = "";
          window.location.assign(result.authorizationUrl);
        } catch (error) {
          status.className = "error";
          status.textContent = error.message || "Could not start Meta login.";
          connectButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
